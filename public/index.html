<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CR Juntos en la prueba</title>
  <meta name="description" content="Agenda de oración por las pruebas y exámenes de los jóvenes de CR.">
  <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151e2e" media="(prefers-color-scheme: dark)">
  <script>
    // Tema elegido en Ajustes (Claro u Oscuro), aplicado antes de pintar para que no parpadee.
    try {
      var tema = localStorage.getItem('cr_tema');
      if (tema === 'light' || tema === 'dark') {
        document.documentElement.dataset.theme = tema;
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = tema === 'dark' ? '#151e2e' : '#2563eb'; });
      }
    } catch (e) {}
  </script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CR Juntos">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <header class="barra">
    <a href="#/" class="marca" aria-label="CR Juntos en la prueba, inicio"><img src="/icons/logo-azul.svg" width="34" height="21" alt="" class="marca-icono"><span class="marca-texto">JUNTOS EN LA PRUEBA</span></a>
    <nav id="nav" class="nav" aria-label="Secciones" hidden></nav>
  </header>
  <main id="vista" class="contenedor" tabindex="-1">
    <p class="cargando">Cargando…</p>
  </main>
  <nav id="tabs" class="tabs" aria-label="Secciones" hidden></nav>
  <div id="aviso" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
